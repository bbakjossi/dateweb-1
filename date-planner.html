<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민쭌💕하연 데이트 플래너</title>
<style>
  :root{
    --bg:#fff7f3; --card:#ffffff; --pink:#ffb6c8; --pink-d:#ff8fab; --mint:#bdeee0; --mint-d:#6fd1b4;
    --yellow:#ffe9a8; --sky:#cfe6ff; --ink:#5a4a52; --muted:#a8969e; --line:#f3e1e6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);
    background-image:radial-gradient(#ffe3ea 1.5px,transparent 1.5px);background-size:22px 22px;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 80px}
  header{text-align:center;padding:10px 0 4px}
  h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.5px}
  h1 span{color:var(--pink-d)}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .mascots{display:flex;justify-content:center;gap:10px;margin-top:8px}
  .mascot{cursor:pointer;transition:transform .2s}
  .mascot:hover{transform:translateY(-6px) rotate(-4deg)}
  .bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin:10px auto 18px;
    max-width:360px;font-size:14px;text-align:center;min-height:42px}
  .bubble:after{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom-color:var(--line);border-top:0}
  .card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
  .card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pink);color:#fff;font-size:14px}
  label.lb{font-size:13px;color:var(--muted);display:block;margin:10px 0 6px}
  input[type=date],input[type=time],input[type=text],textarea,select{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--line);
    font-size:15px;font-family:inherit;color:var(--ink);background:#fffdfc;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--pink)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;user-select:none;
    font-family:inherit;color:var(--ink);transition:all .15s}
  .chip:hover{border-color:var(--pink)}
  .chip.on{background:var(--pink);border-color:var(--pink-d);color:#fff;font-weight:600}
  .chip.mint.on{background:var(--mint-d);border-color:#4fbf9f}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
  .tab.on{background:var(--yellow);border-color:#f5d36b}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px;max-height:260px;overflow:auto;padding:2px}
  .grid .chip{text-align:center;border-radius:12px;padding:8px 4px}
  .btn{border:none;border-radius:16px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-main{background:var(--pink-d);color:#fff;width:100%;box-shadow:0 4px 0 #e5728f}
  .btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 #e5728f}
  .btn-soft{background:var(--sky);color:var(--ink)}
  .btn-mint{background:var(--mint);color:var(--ink)}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:12px}
  .addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
  .picked{margin-top:10px;font-size:14px;color:var(--pink-d);font-weight:600;min-height:20px}
  .summary{background:#fffaf0;border:2px dashed #f5d36b;border-radius:18px;padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
  .plan{border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;background:#fff}
  .plan .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dday{background:var(--mint);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
  .dday.past{background:#eee;color:#999}
  .plan .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .plan .acts{font-size:13px;margin-top:6px}
  .plan .ops{display:flex;gap:6px;margin-top:8px}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:10px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;
    border-radius:999px;font-size:14px;transition:transform .3s;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .spin{animation:wob .5s ease}
  @keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  .btn-photo{width:100%;background:linear-gradient(90deg,#ffb6c8,#ffd59e);color:#5a4a52;box-shadow:0 4px 0 #f0b8a0}
  .btn-photo:active{transform:translateY(3px);box-shadow:0 1px 0 #f0b8a0}
  .modal{position:fixed;inset:0;background:rgba(90,74,82,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:24px;padding:16px;max-width:440px;width:100%;max-height:94vh;overflow:auto}
  .modal-title{font-weight:700;text-align:center;margin-bottom:10px}
  .modal-box img{width:100%;border-radius:16px;border:2px solid var(--line);display:block}
  .modal-ops{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .btn-close{background:#f3eef0;color:var(--muted)}
  .modal-tip{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin:10px 0 0}
  .polaroid{background:#fff;padding:10px 10px 6px;border-radius:14px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line);
    width:min(300px,82%);margin:14px auto 0;transform:rotate(-2deg);transition:transform .25s}
  .polaroid:hover{transform:rotate(0) scale(1.02)}
  .polaroid img{width:100%;display:block;border-radius:8px}
  .polaroid .cap{font-size:15px;font-weight:700;color:var(--pink-d);padding:8px 0 2px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>

    <div class="row" style="margin-top:10px">

function fmtDate(s){ if(!s) return "-"; const d=new Date(s+"T00:00"); const w="일월화수목금토"[d.getDay()]; return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${w})`; }
function fmtTime(t){ if(!t) return "-"; let [h,m]=t.split(":").map(Number); const ap=h<12?"오전":h===12?"낮":"오후"; const hh=h%12||12; return `${ap} ${hh}시${m?" "+m+"분":""}`; }
function ddayOf(s){ const t=new Date(); t.setHours(0,0,0,0); const d=new Date(s+"T00:00"); const n=Math.round((d-t)/86400000); return n===0?"D-DAY":n>0?`D-${n}`:`D+${-n}`; }

const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
function loadMascots(){ return Promise.all([...document.querySelectorAll(".mascot")].map(svg=>new Promise(res=>{
  const img=new Image(); img.onload=()=>res(img); img.onerror=()=>res(null);
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(svg)); }))); }
// 단어(또는 항목) 단위로 줄바꿈, 너무 긴 단어만 글자 단위로 자름
function wrapText(ctx,text,maxW,sep=" "){ const out=[];
  String(text).split("\n").forEach(par=>{ let line="";
    par.split(sep).forEach(word=>{ const test=line? line+sep+word : word;
      if(ctx.measureText(test).width<=maxW){ line=test; return; }
      if(line) out.push(line);
      line="";
      for(const ch of word){ if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch; }
    });
    out.push(line); });
  return out; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

async function makeCard(p){
  const W=1080, M=60, IN=56, cardW=W-M*2, textW=cardW-IN*2;
  const rows=[["📅 날짜", fmtDate(p.date)+(p.date?"  ·  "+ddayOf(p.date):"")],["⏰ 시간", fmtTime(p.time)],
    ["📍 위치", p.district? p.city+" "+p.district : "아직 안 정했어"],["🚇 장소", p.station? stName(p.station) : "아직 안 정했어"]];
  if(p.meet) rows.push(["🚩 만나는 곳", p.meet]);
  const ACT_SEP="   ";
  rows.push(["✅ 하고 싶은 것", p.acts.length? p.acts.map(a=>"♡ "+a).join(ACT_SEP) : "같이 정하자!", ACT_SEP]);
  if(p.memo) rows.push(["📝 메모", p.memo]);

  const c=document.createElement("canvas"), ctx=c.getContext("2d");
  ctx.font=`500 40px ${FONT}`;
  const wrapped=rows.map(([k,v,sep])=>[k,wrapText(ctx,v,textW,sep||" ")]);
  const rowsH=wrapped.reduce((s,[,ls])=>s+48+ls.length*54+34,0);
  const top=M+300, H=top+rowsH+150;
  c.width=W; c.height=H;

  // 배경 + 물방울 무늬
  ctx.fillStyle="#fff7f3"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#ffe3ea"; for(let y=10;y<H;y+=36) for(let x=(y/36%2?28:10);x<W;x+=36){ ctx.beginPath(); ctx.arc(x,y,2.5,0,7); ctx.fill(); }
  // 카드
  ctx.fillStyle="#f3e1e6"; rr(ctx,M,M+10,cardW,H-M*2,48); ctx.fill();
  ctx.fillStyle="#fff"; rr(ctx,M,M,cardW,H-M*2,48); ctx.fill();
  ctx.strokeStyle="#f3e1e6"; ctx.lineWidth=4; ctx.stroke();

  // 마스코트
  const ms=await loadMascots(), mw=[150,135,142], gap=30;
  const total=mw.reduce((a,b)=>a+b,0)+gap*2; let mx=(W-total)/2;
  ms.forEach((img,i)=>{ if(img){ const h=mw[i]*img.height/img.width; ctx.drawImage(img,mx,M+40+(135-h),mw[i],h); } mx+=mw[i]+gap; });

  // 제목
  ctx.textAlign="center"; ctx.fillStyle="#ff8fab"; ctx.font=`800 60px ${FONT}`; ctx.fillText("💕 데이트 약속 💕",W/2,M+245);
  // 구분선
  ctx.strokeStyle="#ffd5df"; ctx.setLineDash([12,10]); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(M+IN,top-12); ctx.lineTo(W-M-IN,top-12); ctx.stroke(); ctx.setLineDash([]);

  // 항목
  ctx.textAlign="left"; let y=top+24;
  wrapped.forEach(([k,ls],i)=>{
    ctx.font=`700 30px ${FONT}`; const kw=ctx.measureText(k).width+36;
    ctx.fillStyle=["#ffe0e8","#ffefc4","#d9f4ec","#dcecff"][i%4]; rr(ctx,M+IN,y,kw,44,22); ctx.fill();
    ctx.fillStyle="#5a4a52"; ctx.fillText(k,M+IN+18,y+32); y+=48+8;
    ctx.font=`500 40px ${FONT}`; ls.forEach(l=>{ ctx.fillText(l,M+IN,y+40); y+=54; }); y+=26;
  });

  // 하단
  ctx.textAlign="center"; ctx.fillStyle="#a8969e"; ctx.font=`500 28px ${FONT}`;
  ctx.fillText("민쭌💕하연 데이트 플래너",W/2,H-M-40);
  return c;
}

    cardBlob=await new Promise(r=>c.toBlob(r,"image/png")); cardName=`데이트약속_${p.date}.png`;
    $("photoModal").classList.add("show"); say("짜잔! 예쁜 카드 완성 📸");
  }catch(e){ toast("사진 만들기 실패 ㅠㅠ"); }
}
$("photoBtn").onclick=()=>openPhoto(current());
$("closeModal").onclick=()=>$("photoModal").classList.remove("show");
$("photoModal").onclick=e=>{ if(e.target.id==="photoModal") $("photoModal").classList.remove("show"); };
$("saveImg").onclick=()=>{ const a=document.createElement("a"); a.href=$("photoImg").src; a.download=cardName; document.body.appendChild(a); a.click(); a.remove(); toast("사진 저장 완료! 💾"); };
$("copyImg").onclick=async()=>{ try{ await navigator.clipboard.write([new ClipboardItem({"image/png":cardBlob})]); toast("사진 복사 완료! 카톡에 붙여넣어줘 💌"); }
  catch(e){ toast("이 브라우저는 사진 복사가 안 돼요. 저장해서 보내줘!"); } };
$("shareImg").onclick=async()=>{ try{ const f=new File([cardBlob],cardName,{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"데이트 약속 💕"}); }
    else { toast("공유가 안 되는 환경이에요. '사진 저장'을 눌러줘!"); } }
  catch(e){ if(e.name!=="AbortError") toast("공유 실패 ㅠㅠ 사진 저장을 이용해줘!"); } };

function resetForm(){ $("meetPoint").value=""; $("memo").value=""; $("stationSearch").value=""; $("searchResults").innerHTML="";
  state.district=""; state.station=""; state.acts.clear();
  [...$("timeChips").children].forEach(x=>x.classList.remove("on")); drawDistricts(); drawStations(); drawActs(); render(); }
$("resetBtn").onclick=()=>{ resetForm(); say("새 마음 새 계획! 다시 골라보자 🧽"); };

$("saveBtn").onclick=()=>{ const p=current();
  if(!p.date){ toast("날짜를 골라줘!"); return; } if(!p.district){ toast("지역을 골라줘!"); say("어디로 갈지 아직 몰라… 📍"); return; }
  p.id=Date.now(); plans.push(p); plans.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); store("mallang_plans",plans);
  drawPlans(); toast("데이트 저장 완료! 💾"); say("저장했어! 그날까지 두근두근 💓"); resetForm(); };

function drawPlans(){ const box=$("planList"); box.innerHTML="";
  if(!plans.length){ box.innerHTML='<div class="empty">아직 저장된 데이트가 없어요 ☁️</div>'; return; }
  plans.forEach(p=>{ const dd=ddayOf(p.date); const el=document.createElement("div"); el.className="plan";
    el.innerHTML=`<div class="top"><b>${fmtDate(p.date)} · ${fmtTime(p.time)}</b><span class="dday ${dd.startsWith("D+")?"past":""}">${dd}</span></div>
      <div class="meta">📍 ${p.city} ${p.district}${p.station? " · 🚇 "+stName(p.station):""}${p.meet? " ("+p.meet+")":""}</div>
      ${p.acts.length?`<div class="acts">✅ ${p.acts.join(", ")}</div>`:""}
      ${p.memo?`<div class="meta">📝 ${p.memo}</div>`:""}
      <div class="ops"><button class="btn btn-soft btn-sm" data-p>📸 사진</button><button class="btn btn-soft btn-sm" data-c>📋 복사</button><button class="btn btn-mint btn-sm" data-d>🗑️ 삭제</button></div>`;
    el.querySelector("[data-p]").onclick=()=>openPhoto(p);
    el.querySelector("[data-c]").onclick=async()=>{ try{ await navigator.clipboard.writeText(toText(p)); toast("복사 완료! 💌"); }catch(e){ toast("복사 실패 ㅠㅠ"); } };
    el.querySelector("[data-d]").onclick=()=>{ plans=plans.filter(x=>x.id!==p.id); store("mallang_plans",plans); drawPlans(); toast("삭제했어"); };
    box.appendChild(el); }); }

document.querySelectorAll(".mascot").forEach(m=>m.onclick=()=>{ const L=LINES[m.dataset.m]; say(L[Math.floor(Math.random()*L.length)]);
  m.classList.remove("spin"); void m.offsetWidth; m.classList.add("spin"); });

drawTabs(); drawDistricts(); drawStations(); drawActs(); drawPlans(); render();
</script>
</body>
</html>
